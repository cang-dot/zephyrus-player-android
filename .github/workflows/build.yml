name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build Web
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Install build-tools 29.0.3 for APK signing
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "build-tools;29.0.3"

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        continue-on-error: true

      - name: Fallback to unsigned if signing fails
        if: steps.sign_apk.outcome == 'failure'
        run: |
          echo "Signing failed, using unsigned release APK"
          cp android/app/build/outputs/apk/release/*.apk android/app/build/outputs/apk/release/zephyrus-player.apk

      - name: Rename APK
        run: |
          APK_DIR="android/app/build/outputs/apk/release"
          SIGNED="${{ steps.sign_apk.outputs.SIGNED_RELEASE_FILE }}"
          if [ -n "$SIGNED" ] && [ -f "$SIGNED" ]; then
            cp "$SIGNED" "zephyrus-player-${{ github.ref_name }}.apk"
            echo "Using signed APK: $SIGNED"
          else
            cp "$APK_DIR/app-release-unsigned.apk" "zephyrus-player-${{ github.ref_name }}.apk" 2>/dev/null || \
            cp "$APK_DIR"/*.apk "zephyrus-player-${{ github.ref_name }}.apk"
            echo "WARNING: signing output not found, using unsigned APK"
          fi
          ls -la "zephyrus-player-${{ github.ref_name }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "zephyrus-player-${{ github.ref_name }}.apk"
          if-no-files-found: error

  release:
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: release

      - name: Prepare release
        run: |
          ls -la release/
          echo "## Release ${{ github.ref_name }}" > release_notes.md
          echo "" >> release_notes.md
          if [ -f RELEASE_NOTES.md ]; then
            cat RELEASE_NOTES.md >> release_notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          body_path: release_notes.md
          files: release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
